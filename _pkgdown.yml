url: https://jessedunnack.github.io/iSCORE-PDecipher/

template:
  bootstrap: 5
  bootswatch: flatly
  theme: arrow-light
  bslib:
    primary: "#3c8dbc"
    bg: "#ffffff"
    fg: "#2c3e50"

home:
  title: "iSCORE-PDecipher: Integrated Analysis of Parkinson's Disease Mutations and CRISPRi Perturb-seq"
  description: >
    Comprehensive R package and Shiny application for analyzing Parkinson's disease
    genetic mutations (via MAST) and CRISPRi Perturb-seq experiments (via Mixscale).
    Features signature discovery, pathway enrichment, and interactive visualizations.

navbar:
  structure:
    left: [home, intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    intro:
      text: Get Started
      href: articles/getting-started.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Vignettes
      - text: Getting Started
        href: articles/getting-started.html
      - text: Perturb-seq Workflow
        href: articles/perturbseq-workflow.html
      - text: Signature Discovery
        href: articles/signature-discovery.html
      - text: Advanced Customization
        href: articles/advanced-customization.html
      - text: -------
      - text: Documentation
      - text: Comprehensive Documentation
        href: ISCORE_COMPREHENSIVE_DOCUMENTATION.html
      - text: Modernization Recommendations
        href: ISCORE_MODERNIZATION_RECOMMENDATIONS.html
      - text: Documentation Audit Report
        href: ISCORE_DOCUMENTATION_AUDIT_REPORT.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/jessedunnack/iSCORE-PDecipher

